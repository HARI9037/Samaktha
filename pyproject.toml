[project]
name = "samaktha-core"
version = "0.5.0"
description = "Samaktha Core v0.5 backend foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "uvicorn>=0.30.0",
    "faster-whisper",
    "sounddevice",
    "soundfile",
    "numpy",
    "openwakeword",
    "docling>=2.15.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "pytesseract>=0.3.10",
    "ddgs==9.16.0",
    "httpx>=0.27.0",
    "textual>=8.2.8,<9",
    "PyMuPDF>=1.26.0",
    "pdfplumber>=0.11.0",
    "pypdf>=5.0.0",
    "beautifulsoup4>=4.12.0",
    "Pillow>=10.0.0",
    "pyperclip>=1.9.0",
    "pystray>=0.19.5; sys_platform == 'win32'",
    "keyboard>=0.13.5; sys_platform == 'win32'",
    "Windows-Toasts>=1.3.0; sys_platform == 'win32'",
    "pywin32>=308; sys_platform == 'win32'",
]

[project.scripts]
samaktha = "app.cli:main"
samaktha-plugin = "app.plugins.sdk.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.24.0",
    "pyinstaller>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
