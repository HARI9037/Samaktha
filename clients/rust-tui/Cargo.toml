[package]
name = "rust-tui"
version = "0.1.0"
edition = "2021"
description = "Protocol-compatible Rust TUI client for Samaktha"
license = "MIT"

[dependencies]
# Terminal UI
ratatui = { version = "0.28", features = ["crossterm"] }
crossterm = "0.28"

# Async runtime
tokio = { version = "1.40", features = ["full"] }

# HTTP/SSE client
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "cookies", "gzip"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time/date
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Terminal sanitization
vte = "0.11"
regex = "1.10"

# URL handling
url = "2.5"

# Async utilities
futures = "0.3"
rand = "0.8"
pin-project-lite = "0.2"
bytes = "1.5"

# Configuration
config = "0.14"

# CLI parsing
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
pretty_assertions = "1.4"
tokio-test = "0.4"
axum = { version = "0.7", features = ["json"] }
futures = "0.3"

[[test]]
name = "protocol_fixtures"
path = "tests/protocol_fixtures.rs"

[[test]]
name = "state_machine"
path = "tests/state_machine.rs"

[[test]]
name = "sse_reconnect"
path = "tests/sse_reconnect.rs"

[[test]]
name = "parity_tests"
path = "tests/parity_tests.rs"